# Prometheus scrape config — dev orchestrator (plan U7).
# Scrapes the otel-collector's Prometheus exporter; the collector aggregates
# metrics from every ShopFlow service via OTLP and re-exposes them on :8889.
# Production swaps the static_configs target for service discovery.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          stack: shopflow
          env: dev
