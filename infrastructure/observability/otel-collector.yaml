# OpenTelemetry Collector config — dev orchestrator (plan U7).
#
# Receives OTLP from every ShopFlow service over HTTP (4318), routes:
#   - traces  → Tempo (otlp/grpc 4317)
#   - logs    → Seq (Seq's native ingestion runs on the container's :80,
#               exposed to host as :5341; the collector forwards via the
#               `otlphttp/seq` exporter which posts to /ingest/otlp)
#   - metrics → Prometheus scrape endpoint at :8889
#
# Production hardening — auth, sampling, batch tuning — lands in U10.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  resource:
    attributes:
      - key: deployment.environment
        value: dev
        action: upsert

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  otlphttp/seq:
    endpoint: http://seq:80/ingest/otlp
    encoding: proto

  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlphttp/seq]
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [prometheus]
