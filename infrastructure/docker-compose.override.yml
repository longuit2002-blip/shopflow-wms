# ShopFlow WMS — local-dev Compose overrides.
#
# Compose auto-loads docker-compose.override.yml on top of
# docker-compose.yml when invoked from this directory. Anything
# developer-machine-specific (bind mounts for hot reload, exposed
# dashboard ports, looser healthcheck cadences) belongs here. The base
# docker-compose.yml stays clean for the production-handoff role.
#
# This file is committed; per-developer overrides should use
# `docker compose -f` chaining or COMPOSE_FILE env variable instead of
# editing a tracked file.

services:
  postgres:
    environment:
      # Faster checkpoints for dev — durability matters less when state
      # is regularly rebuilt.
      POSTGRES_INITDB_ARGS: "--data-checksums"

  rabbitmq:
    environment:
      # Lower default load shedding pressure so noisy local tests do
      # not get evicted by the broker before fixing the symptom.
      RABBITMQ_DEFAULT_VHOST: "/"

  shopee-mock:
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug

  lazada-mock:
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
