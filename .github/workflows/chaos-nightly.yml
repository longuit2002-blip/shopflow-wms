name: chaos-nightly

# Nightly extended-suite workflow for Phase-0-redux (plan U10).
#
# Covers what doesn't fit in the per-PR budget:
#   • full integration suite (every Category=Integration test)
#   • property suite (FsCheck reservation-ledger invariants —
#     Sprint-1-redux owns the actual content)
#   • scale gates (k6 / NBomber load — Sprint-1-redux owns the
#     actual scenarios; Phase-0-redux ships the harness shape)
#   • chaos gates (Docker-killed Postgres, PgBouncer restart under
#     load — Phase-2 deliverable; harness lives here so Phase-2
#     can fill it in without re-shaping the workflow)
#
# Schedule: 03:00 UTC daily — quiet hour for SEA on-call. Manual
# workflow_dispatch is wired for ad-hoc runs.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      filter:
        description: "Optional dotnet test --filter override"
        required: false
        default: "Category=Integration|Category=Property"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  integration-property:
    name: integration + property
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (pinned via global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Run nightly integration + property suite
        env:
          FILTER: ${{ inputs.filter || 'Category=Integration|Category=Property' }}
        run: >-
          dotnet test --no-build --configuration Release
          --filter "$FILTER"
          --logger "console;verbosity=normal"

  load-and-chaos:
    name: load + chaos
    runs-on: ubuntu-latest
    needs: integration-property
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (pinned via global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Run load suite (NBomber)
        # Sprint-1-redux + Phase-2 ship the actual load scenarios; this
        # step is a placeholder so the workflow shape stabilises before
        # the content lands. The filter currently matches zero tests on
        # an empty harness; the step is `continue-on-error` to keep the
        # nightly green while the harness is empty.
        continue-on-error: true
        run: >-
          dotnet test --no-build --configuration Release
          --filter "Category=Load"
          --logger "console;verbosity=normal"
