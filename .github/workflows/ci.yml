name: ci

# Per-PR CI workflow for Phase-0-redux (plan U10).
#
# Stages, in order:
#   1. restore + build (warn-as-error from Directory.Build.props)
#   2. csharpier --check (formatting gate; pre-commit equivalent)
#   3. unit tests (Category != Integration && Category != Load)
#   4. migration smoke + cross-tenant routing tests
#      (Category == Integration; the load-bearing per-PR carve-out
#      per AGENTS.md §8.61 — the bulk of the integration suite runs
#      nightly in chaos-nightly.yml.)
#   5. analyzers — implicit, build fails on ShopFlow0001-0004 violations
#      (.editorconfig severity is Error since U10).
#
# Testcontainers needs a Docker daemon on the runner; GitHub-hosted
# ubuntu-latest provides one out of the box. The integration job runs
# after the unit job so a unit-test failure short-circuits the slower
# integration lane.

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-and-unit-test:
    name: build + unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (pinned via global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release, warn-as-error)
        run: dotnet build --no-restore --configuration Release

      - name: Check formatting (csharpier)
        run: dotnet csharpier --check .

      - name: Unit tests
        run: >-
          dotnet test --no-build --configuration Release
          --filter "Category!=Integration&Category!=Load"
          --logger "console;verbosity=normal"

  integration-test:
    name: migration smoke + cross-tenant routing
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (pinned via global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Integration tests (Testcontainers Postgres)
        run: >-
          dotnet test --no-build --configuration Release
          tests/ShopFlow.SharedKernel.IntegrationTests/ShopFlow.SharedKernel.IntegrationTests.csproj
          --filter "Category=Integration"
          --logger "console;verbosity=normal"
