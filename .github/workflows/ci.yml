name: CI

# Phase-0 CI workflow. Per docs/plans/2026-04-27-001-feat-shopflow-wms-
# phase-0-bootstrap-plan.md U9: build + unit + property tests + formatter
# in a < 10 min budget. The cold-start gate and Compose smoke check are
# stubbed today; they grow into real gates once the shopflow-gate CLI
# (U11) lands.

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: CSharpier format check
        # CSharpier 0.30.x uses the --check flag (not a `check` subcommand).
        # See docs/solutions/2026-04-28-csharpier-cli-syntax.md.
        run: dotnet csharpier --check .

      - name: Unit + property tests
        # Excludes Integration (Testcontainers — runs in a follow-up job
        # once Docker-in-Actions is wired) and Load (NBomber — nightly
        # only per AGENTS.md rule 59). Property suite is included; it
        # asserts on the type-of-failure (NotImplementedException) until
        # the real implementations land in W3+. Pattern documented in
        # docs/solutions/2026-05-10-green-against-stub-property-suite.md.
        run: >
          dotnet test
          --no-build
          --configuration Release
          --filter "Category!=Integration&Category!=Load"
          --logger "trx;LogFileName=unit-results.trx"
          --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

  cold-start-gate:
    name: cold-start gate (informational pre-U10)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stub — Phase-0 cold-start gate
        run: |
          echo "TODO(U10/U11): exercise the Aspire AppHost cold-start gate"
          echo "Per ADR-0001 the dev orchestrator targets < 60s cold-start"
          echo "(plan U9 names the < 90s ceiling). The real gate runs"
          echo "nightly with Testcontainers + Aspire CLI once available;"
          echo "the per-PR gate ships with U11 (shopflow-gate CLI v1)."

  compose-smoke:
    name: docker-compose smoke (informational pre-U10)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stub — Compose drift check
        run: |
          echo "TODO(U11): diff the resource list between"
          echo "src/AppHost/ShopFlow.AppHost/Program.cs and"
          echo "infrastructure/docker-compose.yml; fail on divergence."
          echo "Per ADR-0001 the two manifests must list the same external"
          echo "services. The shopflow-gate CLI (U11) provides the operational"
          echo "gate; this stub names the contract."
